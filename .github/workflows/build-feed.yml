name: Build Media Selangor RSS feed

on:
  # PRIMARY cadence is driven by an external scheduler (cron-job.org) that calls
  # the workflow_dispatch REST API every 30 min, 07:00–22:00 MYT. GitHub's native
  # cron is best-effort and routinely drops/delays runs at the top of the hour,
  # so it is kept below only as an hourly safety net. See the README
  # ("External scheduler") for the trigger setup.
  schedule:
    # Fallback only (GitHub cron is UTC; Malaysia is a fixed UTC+8, no DST).
    # Hourly across the tamilnewsbot digest window (07:00–22:00 MYT): each :13
    # build lands ~45 min before the bot's top-of-hour run picks it up.
    - cron: '13 0-14,23 * * *'   # 07:13–22:13 MYT — off-peak minute to dodge contention
  workflow_dispatch:           # external trigger + manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: build-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build feed
        run: python scripts/build_feed.py

      - name: Commit updated feed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml state/seen.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update feed $(date -u +'%Y-%m-%dT%H:%MZ')"
          # Push with a short rebase-retry loop in case a concurrent run landed first.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push failed (attempt $attempt); rebasing and retrying…"
            git pull --rebase --autostash
          done
          echo "Failed to push after retries." >&2
          exit 1
